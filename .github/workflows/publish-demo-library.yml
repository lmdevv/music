name: Publish demo library

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New unused version (vN, for example v2)"
        required: true
        type: string

concurrency:
  group: publish-demo-library-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: >-
          nix shell --inputs-from . nixpkgs#ffmpeg --command
          scripts/build-demo-library.sh --version "$DEMO_LIBRARY_VERSION" --push
        env:
          DEMO_LIBRARY_VERSION: ${{ inputs.version }}
