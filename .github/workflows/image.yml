name: Image

# Builds the image for both platforms on pull requests that can change it, so an arm64-only
# break shows up before merge. Nothing is pushed here: CI's `publish` job pushes the image once
# every check has passed on main or a release tag.
on:
  pull_request:
    paths:
      - "deploy/**"
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/image.yml"

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=multiarch
          cache-to: type=gha,scope=multiarch,mode=max
