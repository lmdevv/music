name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A newer push to a pull request cancels its older run. Every push to main or a tag gets a run of
# its own (one group per commit), so every commit is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm test
      - run: pnpm knip

  stack-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # Built through the same cache the publish job reads, so the amd64 image it pushes is made
      # of the layers tested here.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: music:stack-e2e
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
      - run: scripts/stack-e2e.sh
        env:
          IMAGE: music:stack-e2e
      # Each supported release, upgraded in place to this image, then rolled back: 0.1.0, the
      # oldest, and 0.2.0, the one before this release.
      - run: scripts/upgrade-e2e.sh
        env:
          IMAGE: music:stack-e2e
      - run: scripts/upgrade-e2e.sh
        env:
          IMAGE: music:stack-e2e
          OLD_IMAGE: ghcr.io/lmdevv/music:0.2.0@sha256:d0b19fce0acee3b39519e11c5b86343e1abf9f2c028ec41337c03704c73ab51e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stack-e2e-results
          path: apps/web/test-results/stack

  # The suites that need a live backend, each on a fresh self-hosted Convex: backend
  # authorization, the CLI binary, the media service, and the web app's Playwright suite.
  backend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: scripts/backend-e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-e2e-results
          path: apps/web/test-results

  # Evaluates the flake for every system, including the NixOS module's checks, and builds the
  # module check and the CLI package (a stale pnpm dependency hash fails here).
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --all-systems --no-build
      - run: nix build -L .#checks.x86_64-linux.module .#checks.x86_64-linux.cli
      - run: nix run .#cli -- --version

  # Boots the NixOS module in a VM with a real image (nix/vm-test.nix). The runners have KVM;
  # the udev rule lets the nix build user open it.
  nixos-vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix build -L .#checks.x86_64-linux.vm

  # Publishes the image only after every check above passed for this commit. The immutable tags
  # (`sha-<commit>`, and the version from a release tag) are always pushed. The moving ones only
  # move forwards: `main` if this commit is still the branch's head, `latest` and `major.minor` if
  # this release is the highest version (in its minor series, for `major.minor`).
  publish:
    needs: [check, stack-e2e, backend-e2e, nix, nixos-vm]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # One publish at a time per ref; the head and version checks below keep the moving tags from
    # going backwards when runs for different commits or tags finish out of order.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
            type=gha,scope=multiarch
          cache-to: type=gha,scope=multiarch,mode=max
      # Checked after the build, right before tagging, against the repository as it is now.
      - name: Move the moving tags forward only
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          REMOTE: https://github.com/${{ github.repository }}
        run: scripts/publish-moving-tags.sh
