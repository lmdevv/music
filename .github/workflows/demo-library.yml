name: Demo library

# Builds the demo library image when what goes into it changes. On main it publishes the version
# named in deploy/demo-library/image, once; a published version is never overwritten.
on:
  pull_request:
    paths: &paths
      - "deploy/demo-library/**"
      - "scripts/download-demo-music.sh"
      - "scripts/build-demo-library.sh"
      - ".github/workflows/demo-library.yml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: demo-library-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/build-demo-library.sh ${{ github.event_name != 'pull_request' && '--push' || '' }}
